<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>Secure Executive Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', 'Malgun Gothic', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
        
        /* 커스텀 체크박스 */
        .custom-checkbox {
            appearance: none; background-color: #0f172a; margin: 0; font: inherit; color: currentColor;
            width: 1.15em; height: 1.15em; border: 1px solid #334155; border-radius: 0.25em;
            display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox::before {
            content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white; background-color: transparent; transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before { transform: scale(1); }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        
        /* 캘린더 다크 테마 */
        :root { --cal-cell: #0f172a; --cal-border: #1e293b; --cal-red: #f87171; --cal-today-bg: #1e293b; --cal-today-border: #3b82f6; }
        #view-calendar .cal-nav-buttons { display: flex; justify-content: space-between; margin-bottom: 15px; }
        #view-calendar .cal-nav-buttons button { flex: 1; background-color: transparent; color: #94a3b8; border: 1px solid #334155; padding: 8px 0; margin: 0 2px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        #view-calendar .cal-nav-buttons button.active { background-color: #1e293b; color: #fff; font-weight: bold; border-color: #475569; }
        #view-calendar .view-header { display: flex; justify-content: space-between; align-items: center; background: var(--cal-cell); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--cal-border); }
        #view-calendar .view-header button { background: none; border: none; font-size: 1.2rem; color: #94a3b8; cursor: pointer; padding: 0 10px; }
        #view-calendar .view-header span { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
        #view-calendar .text-red { color: var(--cal-red) !important; }
        
        #view-calendar .grid-year { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #view-calendar .mini-month { background: var(--cal-cell); padding: 10px; border-radius: 12px; border: 1px solid var(--cal-border); }
        #view-calendar .mini-month-title { text-align: center; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #cbd5e1; }
        #view-calendar .mini-calendar { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; gap: 2px; }
        #view-calendar .mini-calendar .day-head { color: #64748b; font-size: 0.7rem; }
        #view-calendar .mini-calendar .day { padding: 2px 0; cursor: pointer; border-radius: 4px; color: #cbd5e1; }
        #view-calendar .mini-calendar .day.today { background: var(--cal-today-bg); font-weight: bold; color: #fff; border: 1px solid var(--cal-today-border); }
        
        #view-calendar .grid-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        #view-calendar .day-header { text-align: center; font-weight: bold; padding: 8px 0; background: #0f172a; border-radius: 8px; font-size: 0.85rem; color: #94a3b8; }
        #view-calendar .day-cell { background: var(--cal-cell); border: 1px solid var(--cal-border); min-height: 90px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; border-radius: 8px; color: #cbd5e1; }
        #view-calendar .day-cell.empty { background: transparent; border: none; cursor: default; }
        #view-calendar .day-cell.today { background: var(--cal-today-bg); border-color: var(--cal-today-border); }
        #view-calendar .day-number { font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; }
        #view-calendar .data-indicator { font-size: 0.7rem; color: #60a5fa; line-height: 1.3; word-break: break-all; }
        .checkpoint-indicator { font-size: 0.7rem; color: #f472b6; font-weight: 600; line-height: 1.2; word-break: break-all; margin-bottom: 2px; }
        
        #view-calendar .table-wrapper { overflow-x: auto; background: var(--cal-cell); border-radius: 12px; border: 1px solid var(--cal-border); }
        #view-calendar table { width: 100%; border-collapse: collapse; min-width: 600px; }
        #view-calendar th, #view-calendar td { border: 1px solid var(--cal-border); padding: 8px; text-align: left; vertical-align: top; color: #cbd5e1; }
        #view-calendar th { background-color: #0f172a; text-align: center; position: sticky; top: 0; font-size: 0.85rem; }
        #view-calendar .time-col { width: 60px; text-align: center; font-weight: bold; background: #020617; font-size: 0.75rem; color: #94a3b8; }
        #view-calendar .week-table th { width: calc((100% - 60px) / 7); }
        #view-calendar .week-cell { cursor: pointer; height: 35px; font-size: 0.75rem; color: #94a3b8; }
        #view-calendar .week-cell.today-col { background: #1e293b; }
        #view-calendar input[type="text"].cal-input { width: 100%; border: none; outline: none; background: transparent; color: #f8fafc; font-family: inherit; font-size: 0.85rem; padding: 4px 0; }
        #view-calendar input[type="text"].cal-input:focus { border-bottom: 1px solid #3b82f6; }
        
        @media (max-width: 768px) { #view-calendar .grid-year { grid-template-columns: repeat(2, 1fr); } #view-calendar .day-cell { min-height: 75px; } }
        @media (max-width: 480px) { #view-calendar .grid-year { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-28 relative">

    <!-- Firebase Scripts (v11 Modular) & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // 기존 캘린더 다이어리에서 사용한 프로젝트 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyCh-t2J-o1bgzA79j6J92pBw0VRBYFS1Gc",
            authDomain: "diary-sm.firebaseapp.com",
            databaseURL: "https://diary-sm-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "diary-sm",
            storageBucket: "diary-sm.firebasestorage.app",
            messagingSenderId: "705031468956",
            appId: "1:705031468956:web:e888fb2ff2add1d8c8ba59"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);
        const dbRealtime = getDatabase(app);

        // ==========================================

        // ==========================================
        let userId = null;
        let currentTab = 'calendar'; 
        let unsubFirestoreDiary = null;
        let unsubFirestoreTopics = null;
        let unsubRealtimeCal = null;
        
        let diaryTasks = [];
        let topics = [];
        const collapsedMap = {}; 
        let currentEditTarget = null;
        
        window.calState = {
            view: 'month',
            selectedDate: new Date(),
            diaryData: {} 
        };
        const holidays = ["01-01", "02-16", "02-17", "02-18", "03-01", "05-05", "05-24", "06-06", "08-15", "09-24", "09-25", "09-26", "10-03", "10-09", "12-25"];

        // ==========================================
        // 유틸리티
        // ==========================================
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }
        function escape(s) { return (s || '').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function addDays(d, days) { let r = new Date(d); r.setDate(r.getDate() + days); return r; }
        function addMonths(d, m) { let r = new Date(d); r.setMonth(r.getMonth() + m); return r; }
        function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function fmtMMDD(d) { return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function isHol(d) { return holidays.includes(fmtMMDD(d)); }
        function isSun(d) { return d.getDay() === 0; }
        function isTod(d) { const t = new Date(); return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate(); }

        // ==========================================
        // 인증 (로그인 / 로그아웃)
        // ==========================================
        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-password').value;
            const err = document.getElementById('login-error');
            err.classList.add('hidden');

                err.innerText = "로그인 실패: 계정 정보를 다시 확인하세요."; err.classList.remove('hidden');

                document.getElementById('auth-screen').classList.add('hidden');
                
                const dot = document.getElementById('sync-dot');

                document.getElementById('auth-screen').classList.remove('hidden');

        // ==========================================
        // 데이터 리스너
        // ==========================================
        function initDataListeners() {
            if (!userId) return;

            // 1. Calendar
            const rtdbRef = ref(dbRealtime, `myDiary/${userId}`);
            unsubRealtimeCal = onValue(rtdbRef, (snapshot) => {
                window.calState.diaryData = snapshot.val() || {};

            });

            // 2. Diary
            unsubFirestoreDiary = onSnapshot(collection(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'diaryTasks'), (snapshot) => {

            document.getElementById('view-diary').classList.add('hidden');
            document.getElementById('view-projects').classList.add('hidden');

        // ==========================================
        // WBS Checkpoints Fetcher (for Calendar)
        // ==========================================
        function getWBSCheckpoints(dateStr) {
            let pts = [];
            topics.forEach(l => {
                if(l.dueDate === dateStr) pts.push(`[큰] ${l.title}`);
                (l.mediumTopics||[]).forEach(m => {
                    if(m.dueDate === dateStr) pts.push(`[중] ${m.title}`);
                    (m.smallTopics||[]).forEach(s => {
                        if(s.dueDate === dateStr) pts.push(`[소] ${s.title}`);
                        (s.actions||[]).forEach(a => {
                            // 완료되지 않은 액션만 체크포인트로 노출
                            if(a.dueDate === dateStr && !a.completed) pts.push(`[액션] ${a.title}`);
                        });
                    });
                });
            });
            return pts;
        }

        // ==========================================
        // VIEW 1: 스마트 캘린더 렌더링
        // ==========================================
        const calContent = document.getElementById('calendar-content');
        
        window.goToday = () => { window.calState.selectedDate = new Date(); window.renderCalendar(); };
        window.setViewCalendar = (view, dateStr = null) => {
            window.calState.view = view; if (dateStr) window.calState.selectedDate = new Date(dateStr);
            document.querySelectorAll('#view-calendar .cal-nav-buttons button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active'); window.renderCalendar();
        };
        window.changeDate = (amount, unit) => {
            if (unit === 'day') window.calState.selectedDate = addDays(window.calState.selectedDate, amount);
            if (unit === 'week') window.calState.selectedDate = addDays(window.calState.selectedDate, amount * 7);
            if (unit === 'month') window.calState.selectedDate = addMonths(window.calState.selectedDate, amount);
            if (unit === 'year') window.calState.selectedDate.setFullYear(window.calState.selectedDate.getFullYear() + amount);
            window.renderCalendar();
        };

        window.updateCalData = (date, hour, field, val) => {
            if(!userId) return;
            const db = window.calState.diaryData;
            if (!db[date]) db[date] = {}; if (!db[date][hour]) db[date][hour] = {};
            db[date][hour][field] = val;
            if (!db[date][hour].plan && !db[date][hour].progress && !db[date][hour].review) delete db[date][hour];
            if (Object.keys(db[date]).length === 0) delete db[date];
            set(ref(dbRealtime, `myDiary/${userId}`), db).catch(e => console.error(e));
        };

        window.renderCalendar = () => {
            const s = window.calState;
            if (s.view === 'year') renderYearView(); else if (s.view === 'month') renderMonthView();
            else if (s.view === 'week') renderWeekView(); else if (s.view === 'day') renderDayView();
        };

        function renderYearView() {
            const y = window.calState.selectedDate.getFullYear();
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'year')">◀</button><span>${y}년</span><button onclick="window.changeDate(1, 'year')">▶</button></div><div class="grid-year">`;
            for (let m = 0; m < 12; m++) {
                html += `<div class="mini-month"><div class="mini-month-title">${m + 1}월</div><div class="mini-calendar">`;
                ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => { html += `<div class="day-head ${idx===0?'text-red':''}">${d}</div>`; });
                const fd = new Date(y, m, 1).getDay(); const dim = new Date(y, m + 1, 0).getDate();
                for (let i = 0; i < fd; i++) html += `<div></div>`;
                for (let d = 1; d <= dim; d++) {
                    let cd = new Date(y, m, d); let ds = fmtDate(cd);
                    let red = isSun(cd) || isHol(cd) ? 'text-red' : ''; let tod = isTod(cd) ? 'today' : '';
                    let wbsPts = getWBSCheckpoints(ds);
                    let mark = wbsPts.length > 0 ? '<div style="width:4px;height:4px;background:#f472b6;border-radius:50%;margin:1px auto 0;"></div>' : '';
                    html += `<div class="day ${red} ${tod}" onclick="window.setViewCalendar('day', '${ds}')">${d}${mark}</div>`;
                }
                html += `</div></div>`;
            }
            calContent.innerHTML = html + `</div>`;
        }

        function renderMonthView() {
            const y = window.calState.selectedDate.getFullYear(); const m = window.calState.selectedDate.getMonth();
            const fd = new Date(y, m, 1).getDay(); const dim = new Date(y, m + 1, 0).getDate();
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'month')">◀</button><span>${y}년 ${m + 1}월</span><button onclick="window.changeDate(1, 'month')">▶</button></div><div class="grid-month">`;
            ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => { html += `<div class="day-header ${idx===0?'text-red':''}">${d}</div>`; });
            for (let i = 0; i < fd; i++) html += `<div class="day-cell empty"></div>`;
            for (let d = 1; d <= dim; d++) {
                let cd = new Date(y, m, d); let ds = fmtDate(cd);
                let red = isSun(cd) || isHol(cd) ? 'text-red' : ''; let tod = isTod(cd) ? 'today' : '';
                
                // 1. 달력 Plan 추출
                let sum = '';
                if(window.calState.diaryData[ds]) {
                    let plans = [];
                    for(let h in window.calState.diaryData[ds]) { if(window.calState.diaryData[ds][h].plan) plans.push(window.calState.diaryData[ds][h].plan); }
                    sum = plans.slice(0, 2).join('<br>') + (plans.length > 2 ? '<br>...' : '');
                }
                
                // 2. WBS Checkpoints 추출
                let wbsPts = getWBSCheckpoints(ds);
                let cpStr = '';
                wbsPts.forEach(pt => { cpStr += `<div class="checkpoint-indicator">🚩 ${escape(pt)}</div>`; });

                html += `<div class="day-cell ${tod}" onclick="window.setViewCalendar('day', '${ds}')">
                            <div class="day-number ${red}">${d}</div>
                            ${cpStr}
                            <div class="data-indicator">${sum}</div>
                         </div>`;
            }
            calContent.innerHTML = html + `</div>`;
        }

        function renderWeekView() {
            let cur = new Date(window.calState.selectedDate); cur.setDate(cur.getDate() - cur.getDay()); 
            let end = new Date(cur); end.setDate(cur.getDate() + 6); let wk = Math.ceil(cur.getDate() / 7) || 1;
            let title = `${cur.getFullYear()}년 ${cur.getMonth() + 1}월 ${wk}주차`;
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'week')">◀</button><span>${title}</span><button onclick="window.changeDate(1, 'week')">▶</button></div><div class="table-wrapper"><table class="week-table"><thead><tr><th class="time-col">시간</th>`;
            let wD = [];
            
            // 헤더 요일 및 WBS 체크포인트 출력
            for (let i = 0; i < 7; i++) {
                let d = new Date(cur); d.setDate(cur.getDate() + i); wD.push(d);
                let ds = fmtDate(d);
                let red = isSun(d) || isHol(d) ? 'text-red' : ''; let tod = isTod(d) ? 'style="background:#1e293b;"' : '';
                let wbsPts = getWBSCheckpoints(ds);
                let cpStr = wbsPts.map(pt => `<div class="text-[9px] text-pink-400 font-medium">🚩 ${escape(pt).substring(0,8)}</div>`).join('');
                html += `<th ${tod}><span class="${red}">${d.getDate()} (${['일','월','화','수','목','금','토'][i]})</span>${cpStr}</th>`;
            }
            html += `</tr></thead><tbody>`;
            for (let i = 0; i < 24; i++) {
                const hr = String(i).padStart(2, '0'); html += `<tr><td class="time-col">${hr}:00</td>`;
                for (let j = 0; j < 7; j++) {
                    let dStr = fmtDate(wD[j]);
                    let item = (window.calState.diaryData[dStr] && window.calState.diaryData[dStr][hr]) ? window.calState.diaryData[dStr][hr] : {};
                    let txt = item.plan || item.progress || item.review || "";
                    txt = txt.length > 6 ? txt.substring(0,6) + '..' : txt;
                    html += `<td class="week-cell ${isTod(wD[j])?'today-col':''}" onclick="window.setViewCalendar('day', '${dStr}')">${txt}</td>`;
                }
                html += `</tr>`;
            }
            calContent.innerHTML = html + `</tbody></table></div>`;
        }

        function renderDayView() {
            const dStr = fmtDate(window.calState.selectedDate); const cd = window.calState.selectedDate;
            const red = isSun(cd) || isHol(cd) ? 'text-red' : '';
            
            let wbsPts = getWBSCheckpoints(dStr);
            let cpStr = wbsPts.length > 0 ? `<div class="bg-pink-900/30 border border-pink-500/50 rounded-lg p-2 mb-3"><div class="text-xs text-pink-400 font-bold mb-1">🎯 오늘의 WBS 체크포인트</div>` + wbsPts.map(pt => `<div class="text-xs text-pink-200 ml-1">🚩 ${escape(pt)}</div>`).join('') + `</div>` : '';

            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'day')">◀</button><span>${cd.getFullYear()}년 ${cd.getMonth() + 1}월 <span class="${red}">${cd.getDate()}일</span></span><button onclick="window.changeDate(1, 'day')">▶</button></div>
                        ${cpStr}
                        <div class="table-wrapper"><table><thead><tr><th class="time-col">시간</th><th>계획 (Plan)</th><th>진행 (Do)</th><th>리뷰 (See)</th></tr></thead><tbody>`;
            if (!window.calState.diaryData[dStr]) window.calState.diaryData[dStr] = {};
            for (let i = 0; i < 24; i++) {
                const hr = String(i).padStart(2, '0');
                const row = window.calState.diaryData[dStr][hr] || { plan: '', progress: '', review: '' };
                html += `<tr><td class="time-col">${hr}:00</td>
                        <td><input type="text" class="cal-input" value="${row.plan}" onchange="window.updateCalData('${dStr}', '${hr}', 'plan', this.value)"></td>
                        <td><input type="text" class="cal-input" value="${row.progress}" onchange="window.updateCalData('${dStr}', '${hr}', 'progress', this.value)"></td>
                        <td><input type="text" class="cal-input" value="${row.review}" onchange="window.updateCalData('${dStr}', '${hr}', 'review', this.value)"></td></tr>`;
            }
            calContent.innerHTML = html + `</tbody></table></div>`;
        }

        // ==========================================
        // VIEW 2: 데일리 다이어리
        // ==========================================
        window.addDiaryTask = async () => {
            if (!userId) return;
            const t = document.getElementById('diary-input').value.trim(); const c = document.getElementById('diary-category').value;
            if (!t) return;
            const newTask = { title: t, category: c, completed: false, timestamp: Date.now() };
            document.getElementById('diary-input').value = '';
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'diaryTasks', genId()), newTask);
        };
        window.toggleDiaryTask = async (id, stat) => {
            if(!userId) return; const task = diaryTasks.find(t => t.id === id);

        window.deleteDiaryTask = async (id) => { if(!userId) return; await deleteDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'diaryTasks', id)); };

                            </div>`;

            });

        // ==========================================
        // VIEW 3: 프로젝트 WBS 
        // ==========================================
        
        // 전체 진도 계산 (하위 액션 아이템들의 Completed 수 / 전체 액션 개수)
        const calcStat = (arr) => { const tot = arr.length; const cmp = arr.filter(a=>a.completed).length; return { tot, cmp, pct: tot===0?0:Math.round((cmp/tot)*100) }; };
        const getSmallStats = (sm) => calcStat(sm.actions || []);
        const getMediumStats = (med) => { let t=0, c=0; (med.smallTopics||[]).forEach(sm => { const s = getSmallStats(sm); t+=s.tot; c+=s.cmp; }); return { tot:t, cmp:c, pct:t===0?0:Math.round((c/t)*100) }; };
        const getLargeStats = (topic) => { let t=0, c=0; (topic.mediumTopics||[]).forEach(m => { const s = getMediumStats(m); t+=s.tot; c+=s.cmp; }); return { tot:t, cmp:c, pct:t===0?0:Math.round((c/t)*100) }; };

        // [CRUD] Create
        window.addLargeTopic = async () => {
            if(!userId) return;

            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);

        // [CRUD] Edit Modal
        window.openEditModal = (type, lId, mId=null, sId=null, aId=null) => {

            if(type==='large') target = t; else if(type==='medium') target = t.mediumTopics.find(m=>m.id===mId);
            else if(type==='small') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId);
            else if(type==='action') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId).actions.find(a=>a.id===aId);
            
            document.getElementById('edit-title-input').value = target.title; document.getElementById('edit-date-input').value = target.dueDate || '';
            document.getElementById('edit-modal').classList.remove('hidden'); document.getElementById('edit-modal').classList.add('flex');
        };
        window.closeEditModal = () => { document.getElementById('edit-modal').classList.add('hidden'); document.getElementById('edit-modal').classList.remove('flex'); currentEditTarget = null; };
        
        window.saveEdit = async () => {
            if(!userId || !currentEditTarget) return;
            const title = document.getElementById('edit-title-input').value.trim(); const dueDate = document.getElementById('edit-date-input').value;
            if(!title) return;
            const { type, lId, mId, sId, aId } = currentEditTarget; const t = topics.find(x => x.id === lId); let target = null;
            if(type==='large') target = t; else if(type==='medium') target = t.mediumTopics.find(m=>m.id===mId);
            else if(type==='small') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId);
            else if(type==='action') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId).actions.find(a=>a.id===aId);
            
            target.title = title; target.dueDate = dueDate;
            window.closeEditModal();
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };

        // Render Projects Tree
        function renderProjects() {
            const cont = document.getElementById('project-tree-container'); cont.innerHTML = '';
            let tTot=0, cTot=0; topics.forEach(t => { const s = getLargeStats(t); tTot+=s.tot; cTot+=s.cmp; });
            document.getElementById('stat-total-topics').innerText = topics.length;
            document.getElementById('stat-total-actions').innerText = `${cTot}/${tTot}`;
            document.getElementById('stat-overall-progress').innerText = `${tTot===0?0:Math.round((cTot/tTot)*100)}%`;

            topics.forEach(large => {
                const s = getLargeStats(large); const col = collapsedMap[large.id];
                
                let html = `
                <div class="bg-slate-900/80 border border-slate-700 rounded-2xl overflow-hidden shadow-lg mb-6">
                    <div class="p-4 sm:p-5 bg-gradient-to-r from-slate-900 to-slate-800 border-b border-slate-800">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-3">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="text-base sm:text-lg font-bold text-slate-100">${escape(large.title)}</h3>
                                <span class="text-xs text-rose-400 bg-rose-950/30 px-2 py-0.5 rounded border border-rose-900/30">납기: ${large.dueDate||'미정'}</span>
                            </div>
                            <div class="flex gap-1.5 self-end sm:self-auto">
                                <button onclick="window.openEditModal('large','${large.id}')" class="p-1.5 text-slate-400 hover:text-blue-400 bg-slate-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                <button onclick="window.deleteLargeTopic('${large.id}')" class="p-1.5 text-slate-400 hover:text-red-400 bg-slate-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                <button onclick="window.toggleAccordion('${large.id}')" class="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded-lg"><svg class="w-4 h-4 transform ${col?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-xs mb-1"><span class="text-slate-400">진척도 (${s.cmp}/${s.tot})</span><span class="font-bold text-blue-400">${s.pct}%</span></div>
                        <div class="w-full bg-slate-950 rounded-full h-2"><div class="bg-gradient-to-r from-blue-500 to-teal-400 h-2 rounded-full transition-all duration-500" style="width: ${s.pct}%"></div></div>
                    </div>
                    <div class="${col ? 'hidden' : 'block'} p-3 space-y-4 bg-slate-900/40">`;
                
                (large.mediumTopics||[]).forEach(med => {
                    const mS = getMediumStats(med); const mC = collapsedMap[med.id];
                    html += `
                        <div class="bg-slate-900 border-l-4 border-l-indigo-500 rounded-xl p-3 shadow-sm space-y-3">
                            <div class="flex justify-between items-center flex-wrap gap-2">
                                <div class="flex items-center gap-2">
                                    <h4 class="text-sm font-bold text-slate-200">${escape(med.title)}</h4>
                                    <span class="text-[10px] text-amber-400 bg-amber-950/30 px-1.5 py-0.5 rounded border border-amber-900/30">납기: ${med.dueDate||'미정'}</span>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="window.openEditModal('medium','${large.id}','${med.id}')" class="text-slate-400 hover:text-indigo-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                    <button onclick="window.deleteMediumTopic('${large.id}','${med.id}')" class="text-slate-400 hover:text-red-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                    <button onclick="window.toggleAccordion('${med.id}')" class="text-slate-400"><svg class="w-4 h-4 transform ${mC?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center text-[10px] mb-1"><span class="text-slate-400">달성률 (${mS.cmp}/${mS.tot})</span><span class="font-bold text-indigo-400">${mS.pct}%</span></div>
                            <div class="w-full bg-slate-950 rounded-full h-1.5"><div class="bg-indigo-500 h-1.5 rounded-full transition-all duration-500" style="width: ${mS.pct}%"></div></div>
                            <div class="${mC ? 'hidden' : 'block'} space-y-3 pt-2">`;
                    
                    (med.smallTopics||[]).forEach(sm => {
                        const sS = getSmallStats(sm); const sC = collapsedMap[sm.id];
                        html += `
                                <div class="bg-slate-950/80 border-l-4 border-l-teal-500 rounded-lg p-2 space-y-2">
                                    <div class="flex justify-between items-center flex-wrap gap-2">
                                        <div class="flex items-center gap-2">
                                            <h5 class="text-xs font-semibold">${escape(sm.title)}</h5>
                                            <span class="text-[10px] text-teal-400 bg-teal-950/30 px-1.5 py-0.5 rounded border border-teal-900/30">납기: ${sm.dueDate||'미정'}</span>
                                        </div>
                                        <div class="flex gap-1">
                                            <button onclick="window.openEditModal('small','${large.id}','${med.id}','${sm.id}')" class="text-slate-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                            <button onclick="window.deleteSmallTopic('${large.id}','${med.id}','${sm.id}')" class="text-slate-400 hover:text-red-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                            <button onclick="window.toggleAccordion('${sm.id}')" class="text-slate-400"><svg class="w-3.5 h-3.5 transform ${sC?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button>
                                        </div>
                                    </div>
                                    <div class="w-full bg-slate-900 rounded-full h-1"><div class="bg-teal-400 h-1 rounded-full transition-all duration-500" style="width: ${sS.pct}%"></div></div>
                                    <div class="${sC ? 'hidden' : 'block'} space-y-1.5 pt-1">`;
                        
                        (sm.actions||[]).forEach(act => {
                            html += `
                                        <div class="flex items-center gap-2 bg-slate-900/50 border border-slate-700/50 p-2 rounded hover:bg-slate-800 transition-colors ${act.completed?'opacity-50':''}">
                                            <input type="checkbox" class="custom-checkbox w-3.5 h-3.5 shrink-0" ${act.completed?'checked':''} onchange="window.toggleActionItem('${large.id}','${med.id}','${sm.id}','${act.id}')">
                                            <div class="flex-1 flex items-center justify-between min-w-0">
                                                <span class="text-[11px] sm:text-xs truncate ${act.completed?'line-through text-slate-500':'text-slate-200'}">${escape(act.title)}</span>
                                                <span class="text-[9px] text-amber-400 bg-amber-950/20 px-1 py-0.5 rounded border border-amber-900/20 whitespace-nowrap ml-2">${act.dueDate||'미정'}</span>
                                            </div>
                                            <div class="flex gap-1 shrink-0 ml-1">
                                                <button onclick="window.openEditModal('action','${large.id}','${med.id}','${sm.id}','${act.id}')" class="text-slate-500 hover:text-blue-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                                <button onclick="window.deleteActionItem('${large.id}','${med.id}','${sm.id}','${act.id}')" class="text-slate-500 hover:text-red-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                            </div>
                                        </div>`;
                        });
                        
                        html += `
                                        <div class="flex flex-col sm:flex-row gap-1 pt-1">
                                            <input type="text" id="act-input-${sm.id}" placeholder="[액션] 작업명" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs focus:border-emerald-500 outline-none">
                                            <div class="flex gap-1">
                                                <input type="date" id="act-date-${sm.id}" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-[10px] outline-none">
                                                <button onclick="window.addActionItem('${large.id}','${med.id}','${sm.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white rounded px-2.5 text-[11px] font-semibold whitespace-nowrap">+ 추가</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                    });
                    
                    html += `
                                <div class="flex flex-col sm:flex-row gap-1.5 pt-1">
                                    <input type="text" id="sm-input-${med.id}" placeholder="[3단계] 소주제명" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs focus:border-teal-500 outline-none">
                                    <div class="flex gap-1.5">
                                        <input type="date" id="sm-date-${med.id}" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-[11px] outline-none">
                                        <button onclick="window.addSmallTopic('${large.id}','${med.id}')" class="bg-teal-600 hover:bg-teal-500 text-white rounded-lg px-3 py-1.5 text-xs font-semibold whitespace-nowrap">+ 추가</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
                
                html += `
                        <div class="flex flex-col sm:flex-row gap-2 pt-2">
                            <input type="text" id="med-input-${large.id}" placeholder="[2단계] 중간주제명" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:border-indigo-500 outline-none">
                            <div class="flex gap-2">
                                <input type="date" id="med-date-${large.id}" class="bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs outline-none">
                                <button onclick="window.addMediumTopic('${large.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl px-4 py-2 text-xs font-semibold whitespace-nowrap">+ 추가</button>
                            </div>
                        </div>
                    </div>
                </div>`;
                cont.innerHTML += html;
            });
        }

        // Start App
        window.switchTab('calendar');
        document.getElementById('btn-month').classList.add('active');
        
    </script>
</body>
</html>
