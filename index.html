<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    <title>Secure Executive Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', 'Malgun Gothic', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
        
        .custom-checkbox {
            appearance: none; background-color: #0f172a; margin: 0; font: inherit; color: currentColor;
            width: 1.15em; height: 1.15em; border: 1px solid #334155; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox::before {
            content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white; background-color: transparent; transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before { transform: scale(1); }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        
        :root { --cal-cell: #0f172a; --cal-border: #1e293b; --cal-red: #f87171; --cal-today-bg: #1e293b; --cal-today-border: #3b82f6; }
        #view-calendar .cal-nav-buttons { display: flex; justify-content: space-between; margin-bottom: 15px; }
        #view-calendar .cal-nav-buttons button { flex: 1; background-color: transparent; color: #94a3b8; border: 1px solid #334155; padding: 8px 0; margin: 0 2px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        #view-calendar .cal-nav-buttons button.active { background-color: #1e293b; color: #fff; font-weight: bold; border-color: #475569; }
        #view-calendar .view-header { display: flex; justify-content: space-between; align-items: center; background: var(--cal-cell); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--cal-border); }
        #view-calendar .view-header button { background: none; border: none; font-size: 1.2rem; color: #94a3b8; cursor: pointer; padding: 0 10px; }
        #view-calendar .view-header span { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
        #view-calendar .text-red { color: var(--cal-red) !important; }
        
        #view-calendar .grid-year { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        #view-calendar .mini-month { background: var(--cal-cell); padding: 10px; border-radius: 12px; border: 1px solid var(--cal-border); }
        #view-calendar .mini-month-title { text-align: center; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #cbd5e1; }
        #view-calendar .mini-calendar { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; gap: 2px; }
        #view-calendar .mini-calendar .day-head { color: #64748b; font-size: 0.7rem; }
        #view-calendar .mini-calendar .day { padding: 2px 0; cursor: pointer; border-radius: 4px; color: #cbd5e1; }
        #view-calendar .mini-calendar .day.today { background: var(--cal-today-bg); font-weight: bold; color: #fff; border: 1px solid var(--cal-today-border); }
        
        #view-calendar .grid-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        #view-calendar .day-header { text-align: center; font-weight: bold; padding: 8px 0; background: #0f172a; border-radius: 8px; font-size: 0.85rem; color: #94a3b8; }
        #view-calendar .day-cell { background: var(--cal-cell); border: 1px solid var(--cal-border); min-height: 85px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; border-radius: 8px; color: #cbd5e1; overflow: hidden; }
        #view-calendar .day-cell.empty { background: transparent; border: none; cursor: default; }
        #view-calendar .day-cell.today { background: var(--cal-today-bg); border-color: var(--cal-today-border); }
        #view-calendar .day-number { font-weight: bold; margin-bottom: 3px; font-size: 0.85rem; }
        #view-calendar .data-indicator { font-size: 0.7rem; color: #60a5fa; line-height: 1.2; word-break: break-all; margin-bottom: 2px; }
        
        #view-calendar .table-wrapper { overflow-x: auto; background: var(--cal-cell); border-radius: 12px; border: 1px solid var(--cal-border); }
        #view-calendar table { width: 100%; border-collapse: collapse; min-width: 500px; }
        #view-calendar th, #view-calendar td { border: 1px solid var(--cal-border); padding: 8px; text-align: left; vertical-align: top; color: #cbd5e1; }
        #view-calendar th { background-color: #0f172a; text-align: center; position: sticky; top: 0; font-size: 0.85rem; z-index: 10; }
        #view-calendar .time-col { width: 60px; text-align: center; font-weight: bold; background: #020617; font-size: 0.75rem; color: #94a3b8; }
        #view-calendar .week-table th { width: calc((100% - 60px) / 7); }
        #view-calendar .week-cell { cursor: pointer; height: 35px; font-size: 0.75rem; color: #94a3b8; }
        #view-calendar .week-cell.today-col { background: #1e293b; }
        #view-calendar input[type="text"].cal-input { width: 100%; border: none; outline: none; background: transparent; color: #f8fafc; font-family: inherit; font-size: 0.85rem; padding: 4px 0; }
        #view-calendar input[type="text"].cal-input:focus { border-bottom: 1px solid #3b82f6; }
        
        @media (max-width: 768px) { #view-calendar .grid-year { grid-template-columns: repeat(2, 1fr); } #view-calendar .day-cell { min-height: 70px; } }
        @media (max-width: 480px) { #view-calendar .grid-year { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-28 relative">

    <!-- 🔐 로그인 화면 -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-5">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-white mb-1">🔐 보안 로그인</h2>
                <p class="text-xs text-slate-400">인가된 사용자만 접근할 수 있습니다.</p>
            </div>
            <div class="space-y-3">
                <input type="email" id="login-email" placeholder="이메일 주소" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                <input type="password" id="login-password" placeholder="비밀번호" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                <button onclick="window.handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 text-sm font-bold shadow-md transition-colors mt-2">로그인</button>
            </div>
            <div id="login-error" class="text-xs text-red-400 text-center font-semibold hidden">이메일 또는 비밀번호가 틀렸습니다.</div>
        </div>
    </div>

    <!-- 🌟 메인 앱 컨테이너 -->
    <div class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- 헤더 (검색창 포함) -->
        <header class="mb-6 pb-4 border-b border-slate-800 flex flex-wrap lg:flex-nowrap justify-between items-center gap-3 relative z-50">
            <div class="flex-shrink-0">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-teal-300" id="header-title">스마트 캘린더</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1" id="header-subtitle">월간/주간/일간 일정 및 WBS 연동</p>
            </div>

            <!-- 🔍 검색창 (캘린더 탭에서만 표시) -->
            <div id="cal-search-box" class="w-full lg:flex-1 max-w-md mx-auto relative hidden order-last lg:order-none">
                <div class="flex items-center bg-slate-900 border border-slate-700 rounded-full px-4 py-2 focus-within:border-blue-500 shadow-inner">
                    <svg class="w-4 h-4 text-slate-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="cal-search-input" placeholder="캘린더 및 일기 내용 검색..." class="bg-transparent border-none text-sm text-white w-full focus:outline-none" oninput="window.handleSearch()">
                </div>
                <!-- 검색 결과 드롭다운 -->
                <div id="cal-search-results" class="absolute top-full mt-2 left-0 w-full bg-slate-800 border border-slate-700 rounded-xl shadow-2xl max-h-64 overflow-y-auto hidden flex-col divide-y divide-slate-700"></div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="window.goToday()" id="btn-header-today" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-blue-600/40 transition-colors">Today</button>
                <button onclick="window.handleLogout()" class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 hover:text-white">로그아웃</button>
                <span id="sync-status" class="text-xs font-medium text-slate-400 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse" id="sync-dot"></span> 
                    <span id="sync-text">연결 대기</span>
                </span>
            </div>
        </header>

        <!-- VIEW 1: 스마트 캘린더 -->
        <div id="view-calendar" class="block space-y-4">
            <div class="cal-nav-buttons">
                <button onclick="window.setViewCalendar('year')" id="btn-year">Year</button>
                <button onclick="window.setViewCalendar('month')" id="btn-month">Month</button>
                <button onclick="window.setViewCalendar('week')" id="btn-week">Week</button>
                <button onclick="window.setViewCalendar('day')" id="btn-day">Day</button>
            </div>
            <div id="calendar-content"></div>
        </div>

        <!-- VIEW 2: 데일리 다이어리 (할일) -->
        <div id="view-diary" class="hidden space-y-6">
            <div class="bg-slate-900/80 rounded-2xl p-4 shadow-lg border border-slate-800">
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="diary-input" placeholder="새로운 할 일, 아이디어 입력..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="flex gap-2">
                        <select id="diary-category" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="inbox">📥 Inbox (빠른 수집)</option>
                            <option value="work">🏢 Work (회사 업무)</option>
                            <option value="personal">🎯 Personal (개인 & 자기계발)</option>
                        </select>
                        <button onclick="window.addDiaryTask()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl px-5 py-3 text-sm font-bold shadow-md whitespace-nowrap">추가</button>
                    </div>
                </div>
            </div>
            <div id="diary-lists" class="space-y-6"></div>
        </div>

        <!-- VIEW 3: 프로젝트 WBS -->
        <div id="view-projects" class="hidden space-y-6">
            <section class="grid grid-cols-3 gap-3 mb-2">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center shadow-md">
                    <span class="text-[11px] sm:text-xs text-slate-400 block mb-0.5">전체 큰주제</span>
                    <span id="stat-total-topics" class="text-lg sm:text-xl font-bold text-blue-400">0</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center shadow-md">
                    <span class="text-[11px] sm:text-xs text-slate-400 block mb-0.5">총 액션아이템</span>
                    <span id="stat-total-actions" class="text-lg sm:text-xl font-bold text-indigo-400">0</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center shadow-md">
                    <span class="text-[11px] sm:text-xs text-slate-400 block mb-0.5">전체 달성률</span>
                    <span id="stat-overall-progress" class="text-lg sm:text-xl font-bold text-teal-400">0%</span>
                </div>
            </section>
            <section class="bg-slate-900/80 rounded-2xl p-4 shadow-lg border border-slate-800">
                <h2 class="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    새로운 프로젝트(큰주제) 등록
                </h2>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="large-topic-input" placeholder="큰주제 입력 (예: 공정 수율 개선 TF)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    <div class="flex gap-2">
                        <input type="date" id="large-topic-date" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <select id="large-topic-category" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="work">🏢 회사</option>
                            <option value="personal">🎯 개인</option>
                        </select>
                        <button onclick="window.addLargeTopic()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl px-4 py-2.5 text-sm font-semibold shadow-md whitespace-nowrap">생성</button>
                    </div>
                </div>
            </section>
            <section id="project-tree-container" class="space-y-6"></section>
        </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 w-full bg-slate-900 border-t border-slate-800 pb-safe z-40">
        <div class="max-w-5xl mx-auto flex justify-around items-center">
            <button onclick="window.switchTab('calendar')" id="nav-btn-calendar" class="flex-1 py-4 flex flex-col items-center gap-1 text-blue-400 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-[10px] font-bold">캘린더</span>
            </button>
            <button onclick="window.switchTab('diary')" id="nav-btn-diary" class="flex-1 py-4 flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span class="text-[10px] font-bold">데일리 할일</span>
            </button>
            <button onclick="window.switchTab('projects')" id="nav-btn-projects" class="flex-1 py-4 flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span class="text-[10px] font-bold">프로젝트 WBS</span>
            </button>
        </div>
    </nav>

    <!-- 수정 팝업 모달 (WBS용) -->
    <div id="edit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="edit-modal-title" class="text-base font-bold text-slate-100">항목 수정</h3>
                <button onclick="window.closeEditModal()" class="text-slate-400 hover:text-white p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">제목</label>
                    <input type="text" id="edit-title-input" class="w-full bg-slate-950 text-slate-100 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">납기일</label>
                    <input type="date" id="edit-date-input" class="w-full bg-slate-950 text-slate-100 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button onclick="window.closeEditModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">취소</button>
                <button onclick="window.saveEdit()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-500">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts (v11 Modular) & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCh-t2J-o1bgzA79j6J92pBw0VRBYFS1Gc",
            authDomain: "diary-sm.firebaseapp.com",
            databaseURL: "https://diary-sm-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "diary-sm",
            storageBucket: "diary-sm.firebasestorage.app",
            messagingSenderId: "705031468956",
            appId: "1:705031468956:web:e888fb2ff2add1d8c8ba59"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);
        const dbRealtime = getDatabase(app);

        // ==========================================
        // 글로벌 상태 관리
        // ==========================================
        let userId = null;
        let currentTab = 'calendar'; 
        
        let diaryTasks = [];
        let topics = [];
        const collapsedMap = {}; 
        let currentEditTarget = null;
        
        window.calState = { view: 'month', selectedDate: new Date(), diaryData: {} };
        const holidays = ["01-01", "02-16", "02-17", "02-18", "03-01", "05-05", "05-24", "06-06", "08-15", "09-24", "09-25", "09-26", "10-03", "10-09", "12-25"];

        // ==========================================
        // 인증 로직
        // ==========================================
        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value.trim(); const pw = document.getElementById('login-password').value;
            const err = document.getElementById('login-error'); err.classList.add('hidden');
            if(!email || !pw) { err.innerText = "이메일과 비밀번호를 입력하세요."; err.classList.remove('hidden'); return; }
            try { await signInWithEmailAndPassword(auth, email, pw); } 
            catch (e) { err.innerText = "로그인 실패: 계정 정보를 확인하세요."; err.classList.remove('hidden'); }
        };

        window.handleLogout = async () => { await signOut(auth); location.reload(); };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('sync-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                document.getElementById('sync-text').innerText = '보안 동기화 됨'; document.getElementById('sync-text').className = 'text-emerald-400';
                initDataListeners();
            } else {
                userId = null;
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        function initDataListeners() {
            if (!userId) return;
            // 캘린더 데이터 (Realtime DB)
            onValue(ref(dbRealtime, `myDiary/${userId}`), (snapshot) => {
                window.calState.diaryData = snapshot.val() || {};
                if(currentTab === 'calendar') window.renderCalendar();
            });

        // ==========================================

                document.getElementById('nav-btn-projects').classList.replace('text-slate-500', 'text-blue-400');

        // ==========================================
        // 🔍 검색 기능 (캘린더 / 일기)
        // ==========================================
        window.handleSearch = () => {
            const query = document.getElementById('cal-search-input').value.trim().toLowerCase();
            const resContainer = document.getElementById('cal-search-results');
            resContainer.innerHTML = '';
            
            if(!query) { resContainer.classList.add('hidden'); resContainer.classList.remove('flex'); return; }

            let results = [];
            const db = window.calState.diaryData;
            
            for(const [date, data] of Object.entries(db)) {
                // 일기 검색
                if(data.memo && data.memo.toLowerCase().includes(query)) results.push({ date, type: '일기', text: data.memo });
                // 시간별 내용 검색
                for(let i=0; i<24; i++) {
                    const hr = String(i).padStart(2,'0');
                    if(data[hr]) {
                        if(data[hr].plan && data[hr].plan.toLowerCase().includes(query)) results.push({date, hr, type:'Plan', text: data[hr].plan});
                        if(data[hr].progress && data[hr].progress.toLowerCase().includes(query)) results.push({date, hr, type:'Do', text: data[hr].progress});
                        if(data[hr].review && data[hr].review.toLowerCase().includes(query)) results.push({date, hr, type:'See', text: data[hr].review});
                    }
                }
            }

            if(results.length === 0) {
                resContainer.innerHTML = `<div class="p-4 text-sm text-slate-400 text-center">"${query}"에 대한 검색 결과가 없습니다.</div>`;
            } else {
                results.forEach(r => {
                    const timeStr = r.hr ? `[${r.hr}:00 ${r.type}]` : `[${r.type}]`;
                    const displayTxt = escape(r.text.length > 40 ? r.text.substring(0, 40) + '...' : r.text);
                    resContainer.innerHTML += `
                        <div class="p-3 hover:bg-slate-700 cursor-pointer transition-colors" onclick="window.goToSearchResult('${r.date}')">

                            <div class="text-sm text-slate-200">${displayTxt}</div>
                        </div>`;
                });
            }
            resContainer.classList.remove('hidden'); resContainer.classList.add('flex');
        };

        window.goToSearchResult = (date) => {
            document.getElementById('cal-search-results').classList.add('hidden');
            document.getElementById('cal-search-input').value = '';
            window.setViewCalendar('day', date);
        };

        // ==========================================
        // 🌟 VIEW 1: 스마트 캘린더 & 일기 (Day 뷰)
        // ==========================================
        const calContent = document.getElementById('calendar-content');
        function escape(s) { return (s || '').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function addDays(d, days) { let r = new Date(d); r.setDate(r.getDate() + days); return r; }
        function addMonths(d, m) { let r = new Date(d); r.setMonth(r.getMonth() + m); return r; }
        function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function fmtMMDD(d) { return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function isHol(d) { return holidays.includes(fmtMMDD(d)); }
        function isSun(d) { return d.getDay() === 0; }
        function isTod(d) { const t = new Date(); return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate(); }

        // WBS 납기일을 캘린더 체크포인트로 추출하는 함수
        function getWBSCheckpoints(dateStr) {
            let checkpoints = [];
            topics.forEach(large => {
                if (large.dueDate === dateStr) checkpoints.push(`[대] ${large.title}`);
                (large.mediumTopics || []).forEach(med => {
                    if (med.dueDate === dateStr) checkpoints.push(`[중] ${med.title}`);
                    (med.smallTopics || []).forEach(sm => {
                        if (sm.dueDate === dateStr) checkpoints.push(`[소] ${sm.title}`);
                        (sm.actions || []).forEach(act => {
                            if (act.dueDate === dateStr) checkpoints.push(`[액션] ${act.title}`);
                        });
                    });
                });
            });
            return checkpoints;
        }

        window.goToday = () => { window.calState.selectedDate = new Date(); window.renderCalendar(); };
        window.setViewCalendar = (view, dateStr = null) => {
            window.calState.view = view; if (dateStr) window.calState.selectedDate = new Date(dateStr);
            document.querySelectorAll('#view-calendar .cal-nav-buttons button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active'); window.renderCalendar();
        };
        window.changeDate = (amount, unit) => {
            if (unit === 'day') window.calState.selectedDate = addDays(window.calState.selectedDate, amount);
            if (unit === 'week') window.calState.selectedDate = addDays(window.calState.selectedDate, amount * 7);
            if (unit === 'month') window.calState.selectedDate = addMonths(window.calState.selectedDate, amount);
            if (unit === 'year') window.calState.selectedDate.setFullYear(window.calState.selectedDate.getFullYear() + amount);

        window.updateCalData = (date, hour, field, val) => {

            if (!db[date]) db[date] = {};

            db[date][hour][field] = val;
            if (!db[date][hour].plan && !db[date][hour].progress && !db[date][hour].review) delete db[date][hour];
            if (Object.keys(db[date]).length === 0) delete db[date];
            set(ref(dbRealtime, `myDiary/${userId}`), db).catch(e => console.error(e));
        };

            if (!val && Object.keys(db[date]).length === 1 && Object.keys(db[date])[0] === 'memo') delete db[date];
            set(ref(dbRealtime, `myDiary/${userId}`), db).catch(e => console.error(e));

        window.renderCalendar = () => {
            const s = window.calState;

        function renderYearView() {
            const y = window.calState.selectedDate.getFullYear();
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'year')">◀</button><span>${y}년</span><button onclick="window.changeDate(1, 'year')">▶</button></div><div class="grid-year">`;
            for (let m = 0; m < 12; m++) {
                html += `<div class="mini-month"><div class="mini-month-title">${m + 1}월</div><div class="mini-calendar">`;
                ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => { html += `<div class="day-head ${idx===0?'text-red':''}">${d}</div>`; });
                const fd = new Date(y, m, 1).getDay(); const dim = new Date(y, m + 1, 0).getDate();
                for (let i = 0; i < fd; i++) html += `<div></div>`;
                for (let d = 1; d <= dim; d++) {
                    let cd = new Date(y, m, d); let ds = fmtDate(cd);
                    let red = isSun(cd) || isHol(cd) ? 'text-red' : ''; let tod = isTod(cd) ? 'today' : '';
                    let hasChk = getWBSCheckpoints(ds).length > 0 ? 'border-b-2 border-teal-500' : '';
                    html += `<div class="day ${red} ${tod} ${hasChk}" onclick="window.setViewCalendar('day', '${ds}')">${d}</div>`;
                }
                html += `</div></div>`;
            }
            calContent.innerHTML = html + `</div>`;
        }

        function renderMonthView() {
            const y = window.calState.selectedDate.getFullYear(); const m = window.calState.selectedDate.getMonth();
            const fd = new Date(y, m, 1).getDay(); const dim = new Date(y, m + 1, 0).getDate();
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'month')">◀</button><span>${y}년 ${m + 1}월</span><button onclick="window.changeDate(1, 'month')">▶</button></div><div class="grid-month">`;
            ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => { html += `<div class="day-header ${idx===0?'text-red':''}">${d}</div>`; });
            for (let i = 0; i < fd; i++) html += `<div class="day-cell empty"></div>`;
            for (let d = 1; d <= dim; d++) {
                let cd = new Date(y, m, d); let ds = fmtDate(cd);
                let red = isSun(cd) || isHol(cd) ? 'text-red' : ''; let tod = isTod(cd) ? 'today' : '';
                
                // WBS 체크포인트(🚩) 연동
                let chks = getWBSCheckpoints(ds);
                let chkHtml = chks.map(c => `<div class="text-[10px] text-teal-400 font-bold truncate">🚩 ${escape(c)}</div>`).join('');
                
                let sum = '';
                if(window.calState.diaryData[ds]) {
                    let plans = [];
                    for(let h in window.calState.diaryData[ds]) { if(h!=='memo' && window.calState.diaryData[ds][h].plan) plans.push(window.calState.diaryData[ds][h].plan); }
                    sum = plans.slice(0, 2).join('<br>') + (plans.length > 2 ? '<br>...' : '');
                }
                html += `<div class="day-cell ${tod}" onclick="window.setViewCalendar('day', '${ds}')"><div class="day-number ${red}">${d}</div><div class="data-indicator">${sum}</div><div class="mt-auto pt-1">${chkHtml}</div></div>`;
            }
            calContent.innerHTML = html + `</div>`;
        }

        function renderWeekView() {
            let cur = new Date(window.calState.selectedDate); cur.setDate(cur.getDate() - cur.getDay()); 
            let end = new Date(cur); end.setDate(cur.getDate() + 6); let wk = Math.ceil(cur.getDate() / 7) || 1;
            let title = `${cur.getFullYear()}년 ${cur.getMonth() + 1}월 ${wk}주차`;
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'week')">◀</button><span>${title}</span><button onclick="window.changeDate(1, 'week')">▶</button></div><div class="table-wrapper"><table class="week-table"><thead><tr><th class="time-col">시간</th>`;
            let wD = [];
            for (let i = 0; i < 7; i++) {
                let d = new Date(cur); d.setDate(cur.getDate() + i); wD.push(d);

                let ds = fmtDate(d);
                let chks = getWBSCheckpoints(ds);
                let chkBadge = chks.length > 0 ? `<div class="text-[9px] text-teal-300 mt-1">🚩마감 ${chks.length}건</div>` : '';
                html += `<th ${tod}><span class="${red}">${d.getDate()} (${['일','월','화','수','목','금','토'][i]})</span>${chkBadge}</th>`;
            }
            html += `</tr></thead><tbody>`;
            for (let i = 0; i < 24; i++) {
                const hr = String(i).padStart(2, '0'); html += `<tr><td class="time-col">${hr}:00</td>`;
                for (let j = 0; j < 7; j++) {
                    let dStr = fmtDate(wD[j]);
                    let item = (window.calState.diaryData[dStr] && window.calState.diaryData[dStr][hr]) ? window.calState.diaryData[dStr][hr] : {};
                    let txt = item.plan || item.progress || item.review || "";
                    txt = txt.length > 6 ? txt.substring(0,6) + '..' : txt;
                    html += `<td class="week-cell ${isTod(wD[j])?'today-col':''}" onclick="window.setViewCalendar('day', '${dStr}')">${txt}</td>`;

                html += `</tr>`;
            }
            calContent.innerHTML = html + `</tbody></table></div>`;
        }

        // 🌟 Day View (시간별 계획 + 통 일기장 + WBS 마일스톤) 
        function renderDayView() {
            const dStr = fmtDate(window.calState.selectedDate); const cd = window.calState.selectedDate;
            const red = isSun(cd) || isHol(cd) ? 'text-red' : '';
            
            // 1. 헤더
            let html = `<div class="view-header"><button onclick="window.changeDate(-1, 'day')">◀</button><span>${cd.getFullYear()}년 ${cd.getMonth() + 1}월 <span class="${red}">${cd.getDate()}일 (${['일','월','화','수','목','금','토'][cd.getDay()]})</span></span><button onclick="window.changeDate(1, 'day')">▶</button></div>`;

                         </div>`;

            // 3. 플렉스 레이아웃 (좌: 시간표 / 우: 통 일기장)
            html += `<div class="flex flex-col lg:flex-row gap-4 h-full">`;
            
            // 좌측: 시간별 테이블
            if (!window.calState.diaryData[dStr]) window.calState.diaryData[dStr] = {};
            html += `<div class="table-wrapper flex-[7]"><table><thead><tr><th class="time-col">시간</th><th>계획 (Plan)</th><th>진행 (Do)</th><th>리뷰 (See)</th></tr></thead><tbody>`;

                        <td><input type="text" class="cal-input" value="${row.review}" onchange="window.updateCalData('${dStr}', '${hr}', 'review', this.value)"></td></tr>`;
            }
            html += `</tbody></table></div>`;

            // 우측: 오늘의 일기 (시간 구분 없는 통 메모)
            const memoText = window.calState.diaryData[dStr].memo || '';

                        <h3 class="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> 
                            오늘의 일기
                        </h3>
                        <textarea id="daily-memo" class="flex-1 w-full bg-transparent border-none text-sm text-slate-200 resize-none focus:outline-none leading-relaxed" placeholder="시간에 구애받지 않고 오늘 하루를 자유롭게 기록하세요..." onchange="window.updateDailyMemo('${dStr}', this.value)">${escape(memoText)}</textarea>
                     </div>`;
            
            html += `</div>`;

        }

        // ==========================================
        // VIEW 2: 데일리 다이어리 (Firestore)
        // ==========================================
        window.addDiaryTask = async () => {

        // ==========================================
        // VIEW 3: 프로젝트 WBS (4단계 달성률 Roll-up 완벽 적용)
        // ==========================================
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }
        const calcStat = (arr) => { const tot = arr.length; const cmp = arr.filter(a=>a.completed).length; return { tot, cmp, pct: tot===0?0:Math.round((cmp/tot)*100) }; };
        const getSmallStats = (sm) => calcStat(sm.actions || []);
        const getMediumStats = (med) => { let t=0, c=0; (med.smallTopics||[]).forEach(sm => { const s = getSmallStats(sm); t+=s.tot; c+=s.cmp; }); return { tot:t, cmp:c, pct:t===0?0:Math.round((c/t)*100) }; };
        const getLargeStats = (topic) => { let t=0, c=0; (topic.mediumTopics||[]).forEach(m => { const s = getMediumStats(m); t+=s.tot; c+=s.cmp; }); return { tot:t, cmp:c, pct:t===0?0:Math.round((c/t)*100) }; };

        window.addLargeTopic = async () => {
            if(!userId) return;
            const title = document.getElementById('large-topic-input').value.trim(); const dueDate = document.getElementById('large-topic-date').value; const category = document.getElementById('large-topic-category').value;
            if (!title) return; document.getElementById('large-topic-input').value = '';
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', genId()), { title, dueDate, category, mediumTopics: [], timestamp: Date.now() });
        };
        window.deleteLargeTopic = async (id) => { if(!userId) return; await deleteDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', id)); };
        
        window.addMediumTopic = async (topicId) => {
            if(!userId) return;
            const title = document.getElementById(`med-input-${topicId}`).value.trim(); const dueDate = document.getElementById(`med-date-${topicId}`).value;
            if (!title) return; const t = topics.find(x => x.id === topicId);
            t.mediumTopics.push({ id: genId(), title, dueDate, smallTopics: [] });
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', topicId), t);
        };
        window.deleteMediumTopic = async (lId, mId) => {
            if(!userId) return; const t = topics.find(x => x.id === lId); t.mediumTopics = t.mediumTopics.filter(m => m.id !== mId);
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };
        
        window.addSmallTopic = async (lId, mId) => {
            if(!userId) return;
            const title = document.getElementById(`sm-input-${mId}`).value.trim(); const dueDate = document.getElementById(`sm-date-${mId}`).value;
            if (!title) return; const t = topics.find(x => x.id === lId);
            t.mediumTopics.find(m => m.id === mId).smallTopics.push({ id: genId(), title, dueDate, actions: [] });
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };
        window.deleteSmallTopic = async (lId, mId, sId) => {
            if(!userId) return; const t = topics.find(x => x.id === lId);
            const m = t.mediumTopics.find(x => x.id === mId); m.smallTopics = m.smallTopics.filter(s => s.id !== sId);
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };

        window.addActionItem = async (lId, mId, sId) => {
            if(!userId) return;
            const title = document.getElementById(`act-input-${sId}`).value.trim(); const dueDate = document.getElementById(`act-date-${sId}`).value;
            if (!title) return; const t = topics.find(x => x.id === lId);
            t.mediumTopics.find(m => m.id === mId).smallTopics.find(s => s.id === sId).actions.push({ id: genId(), title, dueDate, completed: false });
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };
        window.toggleActionItem = async (lId, mId, sId, aId) => {
            if(!userId) return;
            const t = topics.find(x => x.id === lId);
            const act = t.mediumTopics.find(m => m.id === mId).smallTopics.find(s => s.id === sId).actions.find(a => a.id === aId);
            act.completed = !act.completed;
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };
        window.deleteActionItem = async (lId, mId, sId, aId) => {
            if(!userId) return;
            const t = topics.find(x => x.id === lId);
            const sm = t.mediumTopics.find(m => m.id === mId).smallTopics.find(s => s.id === sId);
            sm.actions = sm.actions.filter(a => a.id !== aId);
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };
        
        window.toggleAccordion = (id) => { collapsedMap[id] = !collapsedMap[id]; renderProjects(); };

        // --- 수정 모달 (항목 및 납기 수정) ---
        window.openEditModal = (type, lId, mId=null, sId=null, aId=null) => {
            currentEditTarget = { type, lId, mId, sId, aId }; const t = topics.find(x => x.id === lId); let target = null;
            if(type==='large') target = t; else if(type==='medium') target = t.mediumTopics.find(m=>m.id===mId);
            else if(type==='small') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId);
            else if(type==='action') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId).actions.find(a=>a.id===aId);
            
            document.getElementById('edit-title-input').value = target.title; document.getElementById('edit-date-input').value = target.dueDate || '';
            document.getElementById('edit-modal').classList.remove('hidden'); document.getElementById('edit-modal').classList.add('flex');
        };
        window.closeEditModal = () => { document.getElementById('edit-modal').classList.add('hidden'); document.getElementById('edit-modal').classList.remove('flex'); currentEditTarget = null; };
        
        window.saveEdit = async () => {
            if(!userId || !currentEditTarget) return;
            const title = document.getElementById('edit-title-input').value.trim(); const dueDate = document.getElementById('edit-date-input').value;
            if(!title) return;
            const { type, lId, mId, sId, aId } = currentEditTarget; const t = topics.find(x => x.id === lId);
            let target = null;
            if(type==='large') target = t; else if(type==='medium') target = t.mediumTopics.find(m=>m.id===mId);
            else if(type==='small') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId);
            else if(type==='action') target = t.mediumTopics.find(m=>m.id===mId).smallTopics.find(s=>s.id===sId).actions.find(a=>a.id===aId);
            
            target.title = title; target.dueDate = dueDate;
            window.closeEditModal();
            await setDoc(doc(dbFirestore, 'artifacts', 'diary-sm', 'users', userId, 'topics', lId), t);
        };

        function renderProjects() {
            const cont = document.getElementById('project-tree-container'); cont.innerHTML = '';
            let tTot=0, cTot=0; topics.forEach(t => { const s = getLargeStats(t); tTot+=s.tot; cTot+=s.cmp; });
            document.getElementById('stat-total-topics').innerText = topics.length;
            document.getElementById('stat-total-actions').innerText = `${cTot}/${tTot}`;
            document.getElementById('stat-overall-progress').innerText = `${tTot===0?0:Math.round((cTot/tTot)*100)}%`;

            topics.forEach(large => {
                const s = getLargeStats(large); const col = collapsedMap[large.id];
                let html = `<div class="bg-slate-900/80 border border-slate-700 rounded-2xl overflow-hidden shadow-lg mb-6"><div class="p-4 sm:p-5 bg-gradient-to-r from-slate-900 to-slate-800 border-b border-slate-800"><div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-3"><div class="flex items-center gap-2 flex-wrap"><h3 class="text-base sm:text-lg font-bold text-slate-100">${escape(large.title)}</h3><span class="text-xs text-rose-400 font-semibold bg-rose-950 px-2 py-1 rounded">납기: ${large.dueDate||'미정'}</span></div><div class="flex gap-1.5"><button onclick="window.openEditModal('large','${large.id}')" class="p-1.5 text-slate-400 hover:text-blue-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button><button onclick="window.deleteLargeTopic('${large.id}')" class="p-1.5 text-slate-400 hover:text-red-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button><button onclick="window.toggleAccordion('${large.id}')" class="p-1.5 text-slate-400 hover:text-white"><svg class="w-4 h-4 transform ${col?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button></div></div><div class="flex justify-between items-center text-[10px] mb-1 px-1 text-slate-400"><span>달성률 (${s.cmp}/${s.tot})</span><span class="text-blue-400 font-bold">${s.pct}%</span></div><div class="w-full bg-slate-950 h-2"><div class="bg-gradient-to-r from-blue-500 to-teal-400 h-2 transition-all" style="width: ${s.pct}%"></div></div></div><div class="${col ? 'hidden' : 'block'} p-3 space-y-4">`;
                
                (large.mediumTopics||[]).forEach(med => {
                    const mS = getMediumStats(med); const mC = collapsedMap[med.id];
                    html += `<div class="bg-slate-900 border-l-4 border-l-indigo-500 rounded-xl p-3 shadow-sm space-y-3"><div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2"><div class="flex items-center gap-2 flex-wrap"><h4 class="text-sm font-bold text-slate-200">${escape(med.title)}</h4><span class="text-[10px] text-amber-400 bg-amber-950 px-1.5 py-0.5 rounded border border-amber-900">납기: ${med.dueDate||'미정'}</span></div><div class="flex gap-1"><button onclick="window.openEditModal('medium','${large.id}','${med.id}')" class="text-slate-400 hover:text-indigo-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button><button onclick="window.deleteMediumTopic('${large.id}','${med.id}')" class="text-slate-400 hover:text-red-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button><button onclick="window.toggleAccordion('${med.id}')" class="text-slate-400"><svg class="w-4 h-4 transform ${mC?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button></div></div><div class="w-full bg-slate-950 rounded-full h-1.5"><div class="bg-indigo-500 h-1.5 rounded-full transition-all" style="width: ${mS.pct}%"></div></div><div class="${mC ? 'hidden' : 'block'} space-y-3 pt-1">`;
                    
                    (med.smallTopics||[]).forEach(sm => {
                        const sS = getSmallStats(sm); const sC = collapsedMap[sm.id];
                        html += `<div class="bg-slate-950/80 border-l-4 border-l-teal-500 rounded-lg p-3 space-y-2"><div class="flex flex-col sm:flex-row justify-between sm:items-center gap-1"><div class="flex items-center gap-2 flex-wrap"><h5 class="text-xs font-semibold">${escape(sm.title)}</h5><span class="text-[9px] text-teal-300">납기: ${sm.dueDate||'미정'}</span></div><div class="flex gap-1"><button onclick="window.openEditModal('small','${large.id}','${med.id}','${sm.id}')" class="text-slate-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button><button onclick="window.deleteSmallTopic('${large.id}','${med.id}','${sm.id}')" class="text-slate-400 hover:text-red-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button><button onclick="window.toggleAccordion('${sm.id}')" class="text-slate-400"><svg class="w-3.5 h-3.5 transform ${sC?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg></button></div></div><div class="w-full bg-slate-900 rounded-full h-1"><div class="bg-teal-400 h-1 rounded-full transition-all" style="width: ${sS.pct}%"></div></div><div class="${sC ? 'hidden' : 'block'} space-y-1.5 pt-1">`;
                        
                        (sm.actions||[]).forEach(act => {
                            html += `<div class="flex items-center gap-2 bg-slate-900 p-2 rounded ${act.completed?'opacity-50':''}"><input type="checkbox" class="custom-checkbox w-3.5 h-3.5 shrink-0" ${act.completed?'checked':''} onchange="window.toggleActionItem('${large.id}','${med.id}','${sm.id}','${act.id}')"><div class="flex flex-col"><span class="text-xs ${act.completed?'line-through':''}">${escape(act.title)}</span><span class="text-[9px] text-slate-500">납기: ${act.dueDate||'미정'}</span></div><div class="ml-auto flex gap-1"><button onclick="window.openEditModal('action','${large.id}','${med.id}','${sm.id}','${act.id}')" class="text-slate-500 hover:text-blue-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button><button onclick="window.deleteActionItem('${large.id}','${med.id}','${sm.id}','${act.id}')" class="text-slate-500 hover:text-red-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button></div></div>`;
                        });
                        
                        html += `<div class="flex gap-1 mt-2"><input type="text" id="act-input-${sm.id}" placeholder="액션 입력" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs"><input type="date" id="act-date-${sm.id}" class="bg-slate-900 border border-slate-700 rounded px-1 py-1.5 text-[10px] w-24"><button onclick="window.addActionItem('${large.id}','${med.id}','${sm.id}')" class="bg-emerald-600 text-white rounded px-2 text-[11px] font-bold">+ 액션</button></div></div></div>`;
                    });
                    
                    html += `<div class="flex gap-1 mt-3"><input type="text" id="sm-input-${med.id}" placeholder="소주제 입력" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs"><input type="date" id="sm-date-${med.id}" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-[11px] w-28"><button onclick="window.addSmallTopic('${large.id}','${med.id}')" class="bg-teal-600 text-white rounded-lg px-3 py-1.5 text-xs font-bold">+ 소주제</button></div></div></div>`;
                });
                
                html += `<div class="flex gap-2 pt-2"><input type="text" id="med-input-${large.id}" placeholder="중간주제 입력" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"><input type="date" id="med-date-${large.id}" class="bg-slate-950 border border-slate-700 rounded-xl px-2 py-2 text-xs w-32"><button onclick="window.addMediumTopic('${large.id}')" class="bg-indigo-600 text-white rounded-xl px-4 py-2 text-sm font-bold">+ 중간주제</button></div></div></div>`;
                cont.innerHTML += html;
            });
        }

        // Start App
        window.switchTab('calendar');
        document.getElementById('btn-month').classList.add('active');
        
    </script>
</body>
</html>
